<!DOCTYPE html>
<html lang="ja">
<head>

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#f1f5f9; --card:#ffffff; --text:#0f172a; --sub:#64748b; --line:#e2e8f0;
  --accent:#16a34a; --accent2:#0891b2; --ok:#16a34a; --ng:#dc2626; --warn:#d97706;
  --chip:#f1f5f9; --nav:#ffffffee;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0b1120; --card:#1e293b; --text:#f1f5f9; --sub:#94a3b8; --line:#334155;
    --accent:#a3e635; --accent2:#22d3ee; --ok:#4ade80; --ng:#f87171; --warn:#fbbf24;
    --chip:#0f172a; --nav:#0f172aee; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 8px}
header h1{margin:0;font-size:20px}
header .meta{color:var(--sub);font-size:13px}
main{padding:0 12px calc(env(safe-area-inset-bottom) + 90px)}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin:10px 0;box-shadow:0 1px 2px #0000000f}
.card h2{font-size:16px;margin:0 0 8px}
.card h3{font-size:14px;margin:12px 0 6px;color:var(--sub)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.sub{color:var(--sub);font-size:13px}
.big{font-size:28px;font-weight:800}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.ng{background:color-mix(in srgb,var(--ng) 15%,transparent);color:var(--ng)}
.pill.na{background:var(--chip);color:var(--sub)}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px}
.datebar button{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:15px}
.datebar .d{font-weight:700}
.check{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;user-select:none}
.check:first-of-type{border-top:none}
.box{flex:0 0 28px;height:28px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff}
.check.on .box{background:var(--ok);border-color:var(--ok)}
.check.off-week{opacity:.5}
.check.off-week .box{background:var(--chip);color:var(--sub);font-size:11px}
.check .lbl{font-weight:600}
.check .hint{color:var(--sub);font-size:12.5px}
.star{color:var(--warn);font-size:12px;margin-left:4px}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:3px}
.field input,.field select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--text);font-size:16px}
textarea{min-height:64px;font-family:inherit}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:transparent;color:var(--sub);padding:8px 2px;border-radius:9px;font-size:13px;font-weight:700}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px #0002}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.sw{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;border:none;flex:0 0 50px}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}.sw.on::after{left:23px}
.kv{display:grid;grid-template-columns:88px 1fr;gap:6px 10px;font-size:14px}
.kv dt{color:var(--sub)} .kv dd{margin:0}
.progress{height:10px;border-radius:99px;background:var(--chip);overflow:hidden}
.progress>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:6px 3px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{color:var(--sub);font-weight:600}
.scroll{overflow-x:auto}
.todo{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.todo:first-child{border-top:none}
.todo .box{flex-basis:24px;height:24px;border-radius:7px}
.todo.on .box{background:var(--ok);border-color:var(--ok)}
.todo.on .t{text-decoration:line-through;color:var(--sub)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--nav);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;background:none;border:none;color:var(--sub);padding:8px 0 6px;font-size:11px;font-weight:700}
nav button .ic{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--text)}
.btn{display:block;width:100%;padding:12px;border-radius:12px;border:none;background:var(--text);color:var(--bg);font-weight:700;font-size:15px;margin-top:8px}
.btn.ghost{background:var(--chip);color:var(--text)}
.btn.danger{background:color-mix(in srgb,var(--ng) 15%,transparent);color:var(--ng)}
svg text{fill:var(--sub);font-size:10px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:4px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:4px;border-radius:2px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 80px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.hidden{display:none}
</style>
</head>

/* ====== 日付 ====== */
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d);};
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/86400000);
const todayStr=()=>fmt(new Date());
const WD='日月火水木金土';
const label=s=>{const d=parse(s);return `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`;};
function weekOf(s){ const n=diffDays(s,S.start); return n<0?0:Math.floor(n/7)+1; }
function weekStart(w){ return addDays(S.start,(w-1)*7); }
function clampW(w){ return Math.max(1,Math.min(TOTAL_WEEKS,w)); }

/* ====== 計算 ====== */
function day(s){ return S.days[s]||{c:{}}; }
function dayHasData(d){ return d && (Object.values(d.c||{}).some(Boolean) || ['sleep','cig','cola','weight','waist'].some(k=>d[k]!=null&&d[k]!=='') || d.train); }
function defaultShift(s){ const g=parse(s).getDay(); return (g===0||g===6)?'earlyH':'early'; }
function evalDay(s){
  const w=clampW(weekOf(s)); const d=day(s); const c=d.c||{};
  let done=0, starOk=true;
  for(const it of ITEMS){
    const active = w>=it.from;
    const ok = !active || !!c[it.id];
    if(ok) done++;
    if(it.star && !ok) starOk=false;
  }
  const pass = done>=5 || (d.tired && starOk);
  return {done,pass,starOk,has:dayHasData(d)};
}
function weekStats(w){
  const start=weekStart(w), t=todayStr();
  let passDays=0, counted=0, sleeps=[], cigs=[], colas=[], train=0, weight=null, waist=null;
  for(let i=0;i<7;i++){
    const s=addDays(start,i);
    if(s>t) break;
    const d=S.days[s];
    const e=evalDay(s);
    // 今日はまだ途中なので、合格したときだけ数える
    if(s<t || (e.has && e.pass)) counted++;
    if(e.has && e.pass) passDays++;
    if(d){
      if(num(d.sleep)!=null) sleeps.push(num(d.sleep));
      if(num(d.cig)!=null) cigs.push(num(d.cig));
      if(num(d.cola)!=null) colas.push(num(d.cola));
      if(d.train) train++;
      if(num(d.weight)!=null) weight=num(d.weight);
      if(num(d.waist)!=null) waist=num(d.waist);
    }
  }
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  return {counted,passDays,rate:counted?passDays/counted:null,denomFull:counted===7,
    sleep:avg(sleeps),cig:avg(cigs),cola:avg(colas),train,weight,waist};
}
function num(v){ if(v===''||v==null) return null; const n=Number(v); return isFinite(n)?n:null; }
function overallRate(){
  const cw=clampW(weekOf(todayStr())); let rs=[];
  for(let w=1;w<=Math.min(cw,TOTAL_WEEKS);w++){ const st=weekStats(w); if(st.rate!=null) rs.push(st.rate); }
  return rs.length? rs.reduce((a,b)=>a+b,0)/rs.length : null;
}
const pct=r=>r==null?'—':Math.round(r*100)+'%';
const f1=v=>v==null?'—':(Math.round(v*10)/10).toString();

/* ====== UI ====== */
let tab='today', cur=todayStr(), viewWeek=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1500); }
function setDay(s,patch){ const d=S.days[s]||{c:{}}; Object.assign(d,patch); S.days[s]=d; save(); }

function header(){
  const t=todayStr(); const w=weekOf(t);
  const titles={today:'今日',week:'今週やること',graph:'グラフ',table:'週ごとの進捗表',settings:'設定'};
  $('#title').textContent=titles[tab];
  const end=addDays(S.start,TOTAL_WEEKS*7-1);
  const left=diffDays(end,t);
  $('#weekBadge').textContent = w<1 ? `開始まであと${-diffDays(t,S.start)}日` : w>TOTAL_WEEKS ? '13週間おつかれさま' : `W${w}・ゴールまで${left}日`;
}

}

/* ====== グラフ（SVG） ====== */
function chart({series,yMin,yMax,targets=[],height=170,unit=''}){
  const W=340,H=height,L=34,R=8,T=10,B=22;
  const days=TOTAL_WEEKS*7; const x=i=>L+(W-L-R)*i/(days-1);
  const all=series.flatMap(s=>s.pts.map(p=>p[1])).concat(targets.flatMap(t=>t.pts.map(p=>p[1])));
  let ticks=4;
  if(yMin==null||yMax==null){
    const lo=all.length?Math.min(...all):0, hi=all.length?Math.max(...all):4;
    const step=Math.max(1,Math.ceil((hi-lo+1)/4));
    yMin=Math.floor((lo-0.5)/step)*step; ticks=Math.ceil((hi+0.5-yMin)/step); if(ticks<4) ticks=4; yMax=yMin+step*ticks;
  }
  const y=v=>T+(H-T-B)*(1-(v-yMin)/(yMax-yMin));
  let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
  for(let i=0;i<=ticks;i++){ const v=yMin+(yMax-yMin)*i/ticks; const yy=y(v);
    g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L-4}" y="${yy+3}" text-anchor="end">${Math.round(v*10)/10}</text>`; }
  for(let w=1;w<=TOTAL_WEEKS;w+=2){ g+=`<text x="${x((w-1)*7)}" y="${H-6}" text-anchor="start">W${w}</text>`; }
  const ti=diffDays(todayStr(),S.start); if(ti>=0&&ti<days) g+=`<line x1="${x(ti)}" x2="${x(ti)}" y1="${T}" y2="${H-B}" stroke="var(--sub)" stroke-dasharray="2 3"/>`;
  for(const t of targets){ g+=`<polyline fill="none" stroke="${t.color}" stroke-width="1.5" stroke-dasharray="5 4" points="${t.pts.map(p=>`${x(p[0])},${y(p[1])}`).join(' ')}"/>`; }
  for(const s of series){
    if(s.pts.length>1) g+=`<polyline fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" points="${s.pts.map(p=>`${x(p[0])},${y(p[1])}`).join(' ')}"/>`;
    for(const p of s.pts) g+=`<circle cx="${x(p[0])}" cy="${y(p[1])}" r="${s.pts.length>40?1.8:3}" fill="${s.color}"/>`;
  }
  g+=`</svg>`; return g;
}
function points(key){
  const out=[];
  for(let i=0;i<TOTAL_WEEKS*7;i++){ const s=addDays(S.start,i); const d=S.days[s]; if(d&&num(d[key])!=null) out.push([i,num(d[key])]); }
  return out;
}
function stepTarget(fn){ const pts=[]; for(let i=0;i<TOTAL_WEEKS*7;i++){ const w=Math.floor(i/7)+1; pts.push([i,fn(w)]); } return pts.filter(p=>p[1]!=null); }
function renderGraph(){
  const c1='var(--accent2)', c2='var(--accent)', ct='var(--warn)';
  let h='';
  // 達成率（週）
  const cw=clampW(weekOf(todayStr()));
  let bars=`<svg viewBox="0 0 340 160" width="100%">`; const L=34,B=22,T=10,H=160,W=340; const bw=(W-L-8)/TOTAL_WEEKS;
  const y=v=>T+(H-T-B)*(1-v);
  for(const v of [0,.5,1]){ bars+=`<line x1="${L}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-4}" y="${y(v)+3}" text-anchor="end">${v*100}%</text>`; }
  bars+=`<line x1="${L}" x2="${W-8}" y1="${y(.6)}" y2="${y(.6)}" stroke="${ct}" stroke-dasharray="5 4"/>`;
  for(let w=1;w<=TOTAL_WEEKS;w++){ const st=weekStats(w); const r=st.rate; const xx=L+bw*(w-1)+3;
    if(r!=null) bars+=`<rect x="${xx}" y="${y(r)}" width="${bw-6}" height="${Math.max(0,y(0)-y(r))}" rx="3" fill="${r>=.6?c2:'var(--ng)'}"/>`;
    bars+=`<text x="${xx+(bw-6)/2}" y="${H-6}" text-anchor="middle">${w}</text>`; }
  bars+='</svg>';
  const ov=overallRate();
  h+=`<div class="card"><div class="row between"><h2 style="margin:0">週ごとの達成率</h2><span class="pill ${ov==null?'na':ov>=.6?'ok':'ng'}">平均 ${pct(ov)}</span></div>${bars}
    <div class="legend"><span><i style="background:${ct}"></i>合格ライン60%</span><span>13週の平均60%以上が目標（W${cw}まで）</span></div></div>`;
  h+=`<div class="card"><h2>睡眠時間</h2>${chart({series:[{pts:points('sleep'),color:c1}],targets:[{pts:stepTarget(sleepTarget),color:ct}],yMin:2,yMax:10})}
    <div class="legend"><span><i style="background:${c1}"></i>記録</span><span><i style="background:${ct}"></i>週の目標</span></div></div>`;
  const wp=points('weight');
  h+=`<div class="card"><h2>体重</h2>${chart({series:[{pts:wp,color:c1}],targets:[{pts:[[0,72],[TOTAL_WEEKS*7-1,70]],color:ct}]})}
    <div class="legend"><span><i style="background:${c1}"></i>記録（kg）</span><span><i style="background:${ct}"></i>目標 69〜71kg の中央へ</span></div></div>`;
  const ws=points('waist');
  h+=`<div class="card"><h2>腹囲</h2>${ws.length?chart({series:[{pts:ws,color:c2}],targets:[{pts:[[0,ws[0][1]],[TOTAL_WEEKS*7-1,ws[0][1]-3]],color:ct}]}):'<div class="sub">「今日」で腹囲を入力するとここに表示されます。初日から−2〜4cmが目標です。</div>'}
    ${ws.length?`<div class="legend"><span><i style="background:${c2}"></i>記録（cm）</span><span><i style="background:${ct}"></i>初日から−3cm</span></div>`:''}</div>`;
  h+=`<div class="card"><h2>タバコ（本／日）</h2>${chart({series:[{pts:points('cig'),color:'var(--ng)'}],targets:[{pts:stepTarget(smokeLimit),color:ct}],yMin:0,yMax:24})}
    <div class="legend"><span><i style="background:var(--ng)"></i>記録</span><span><i style="background:${ct}"></i>週の目安</span></div></div>`;
  h+=`<div class="card"><h2>普通のコーラ（本／日）</h2>${chart({series:[{pts:points('cola'),color:c1}],targets:[{pts:stepTarget(w=>w===1?3:w===2?2.5:w<=5?2:w<=7?1:w<=9?0.4:0.3),color:ct}],yMin:0,yMax:4})}
    <div class="legend"><span><i style="background:${c1}"></i>記録</span><span><i style="background:${ct}"></i>目安（W8〜は週の本数を1日あたりに換算）</span></div></div>`;
  return h;
}

  header();
  const m=$('#main');
  m.innerHTML = tab==='today'?renderToday(): tab==='week'?renderWeek(): tab==='graph'?renderGraph(): tab==='table'?renderTable(): renderSettings();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
}

/* ====== イベント ====== */
document.getElementById('nav').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return; tab=b.dataset.tab; if(tab==='week') viewWeek=null; render(); window.scrollTo(0,0);
});
document.getElementById('main').addEventListener('click',e=>{
  const it=e.target.closest('[data-item]');
  if(it){ const d=day(cur); const c={...(d.c||{})}; c[it.dataset.item]=!c[it.dataset.item]; setDay(cur,{c}); render(); return; }
  const td=e.target.closest('[data-todo]');
  if(td){ const k=td.dataset.todo; S.todos[k]=!S.todos[k]; save(); render(); return; }
  const sb=e.target.closest('[data-shift]');
  if(sb){ setDay(cur,{shift:sb.dataset.shift}); render(); return; }
  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act;
  if(act==='prev'){ cur=addDays(cur,-1); }
  else if(act==='next'){ cur=addDays(cur,1); }
  else if(act==='today'){ cur=todayStr(); }
  else if(act==='tired'){ setDay(cur,{tired:!day(cur).tired}); }
  else if(act==='gotoWeek'){ tab='week'; viewWeek=clampW(weekOf(cur)); window.scrollTo(0,0); }
  else if(act==='wprev'){ viewWeek=clampW((viewWeek||clampW(weekOf(todayStr())))-1); }
  else if(act==='wnext'){ viewWeek=clampW((viewWeek||clampW(weekOf(todayStr())))+1); }
  else if(act==='export'){ exportData(); return; }
  else if(act==='import'){ $('#importFile').click(); return; }
  else if(act==='reset'){ if(confirm('すべての記録を消します。元に戻せません。よろしいですか？')){ S={start:S.start,days:{},todos:{},weekMemo:{}}; save(); toast('消去しました'); } }
  render();
});
document.getElementById('main').addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.field){ const k=t.dataset.field; let v=t.value; if(t.type==='number') v=v===''?null:Number(v); setDay(cur,{[k]:v}); toast('保存しました'); if(k!=='memo') render(); }
  else if(t.dataset.wmemo){ S.weekMemo[t.dataset.wmemo]=t.value; save(); toast('保存しました'); }
  else if(t.id==='startDate' && t.value){ S.start=t.value; save(); toast('開始日を変更しました'); render(); }
  else if(t.id==='importFile' && t.files[0]){ importData(t.files[0]); }
});
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`akanuke13w-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d||typeof d.days!=='object') throw 0;
      S={start:d.start||DEFAULT_START,days:d.days||{},todos:d.todos||{},weekMemo:d.weekMemo||{}}; save(); toast('読み込みました'); render();
    }catch(_){ toast('読み込めないファイルです'); } };
  r.readAsText(file);
}
// 日付が変わったら「今日」を更新
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ render(); } });

if('serviceWorker' in navigator && location.protocol!=='file:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
render();
</script>
</body>
</html>
